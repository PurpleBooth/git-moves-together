[package]
name = "git-moves-together"
version = "2.8.3"
edition = "2024"
categories = ["development-tools", "command-line-utilities"]
keywords = ["git", "coupling"]
repository = "https://codeberg.org/PurpleBooth/git-moves-together"
description = "Find files that move at the same time in a git repository to identify coupling"
license = "CC0-1.0"
authors = ["Billie Thompson <billie@billiecodes.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "git-moves-together"
path = "src/main.rs"

[dependencies]
git2 = { version = "0.21", features = ["vendored-openssl", "vendored-libgit2"] }
thiserror = "2"
clap = { version = "4", features = [
    "derive",
    "cargo",
    "wrap_help",
    "env",
    "unicode",
] }
comfy-table = "7"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
miette = { version = "7", features = ["fancy"] }
time = "0.3"
[profile.release-max]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
strip = "symbols"


[dev-dependencies]
tempfile = "3"
rand = "0.10"
